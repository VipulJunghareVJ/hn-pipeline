<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HN Daily Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ff6600'/><text x='8' y='12.5' font-size='12' font-family='Verdana' fill='white' text-anchor='middle'>Y</text></svg>">
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root {
  --orange:  #ff6600;
  --orange-light: #fff0e6;
  --orange-mid:   #ffb380;
  --blue:    #4361ee;
  --blue-light:   #eef0fd;
  --green:   #0ab68b;
  --green-light:  #e6faf5;
  --purple:  #7b2ff7;
  --purple-light: #f1ebff;
  --red:     #ef476f;
  --red-light:    #fdedf1;
  --yellow:  #f9a825;
  --cyan:    #0097b2;

  --bg:       #f4f5f7;
  --surface:  #ffffff;
  --border:   #e4e7ec;
  --ink:      #111827;
  --muted:    #6b7280;
  --subtle:   #9ca3af;

  --radius:   12px;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 6px rgba(0,0,0,.07), 0 10px 30px rgba(0,0,0,.08);
}

/* ── Reset ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 3px; }

/* ── Layout ─────────────────────────────────────────── */
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }

/* ── Header ─────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 0 20px;
  display: flex; align-items: center; gap: 12px; height: 56px;
}
.logo-box {
  background: var(--orange);
  color: #fff; font-weight: 700; font-size: 1rem;
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(255,102,0,0.35);
}
header h1 {
  font-size: 1.05rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em;
}
.header-sep { flex: 1; }
.freshness-pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.74rem; color: var(--muted);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 14px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Page title bar ──────────────────────────────────── */
.page-header {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px;
}
.page-header h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
.page-header span { font-size: 0.8rem; color: var(--muted); }
.section-label {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── Metric cards ────────────────────────────────────── */
.metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
@media (max-width: 900px) { .metrics { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .metrics { grid-template-columns: 1fr 1fr; } }

.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px;
  position: relative; overflow: hidden;
}
.metric-icon {
  width: 36px; height: 36px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; margin-bottom: 10px;
  flex-shrink: 0;
}
.metric b {
  font-size: 1.75rem; font-weight: 700; letter-spacing: -0.04em;
  line-height: 1; color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
}
.metric span { font-size: 0.72rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.metric-trend {
  font-size: 0.7rem; font-weight: 600; margin-top: 6px;
  display: flex; align-items: center; gap: 3px;
}

/* ── Cards ───────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px 18px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 0.95rem; font-weight: 600; color: var(--ink);
  letter-spacing: -0.01em; margin-bottom: 3px;
}
.card-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }

/* ── Grids ───────────────────────────────────────────── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 860px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ── Story list ──────────────────────────────────────── */
ol.stories { list-style: none; display: flex; flex-direction: column; gap: 8px; }
ol.stories li {
  display: grid; grid-template-columns: 32px 1fr auto;
  gap: 0 12px; align-items: start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  transition: box-shadow 0.2s, transform 0.15s;
}
ol.stories li:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.story-num {
  font-size: 0.85rem; font-weight: 700; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  text-align: center; padding-top: 1px;
}
.story-bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.story-title { font-size: 0.93rem; font-weight: 500; line-height: 1.4; }
.story-title a:hover { color: var(--orange); }
.story-domain { font-size: 0.74rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.story-meta {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px;
}
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px;
  font-size: 0.69rem; color: var(--muted); font-weight: 500;
}
.badge.score { background: var(--orange-light); border-color: var(--orange-mid); color: var(--orange); font-weight: 700; }
.story-pph {
  font-size: 0.75rem; font-weight: 600; color: var(--blue);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap; padding-top: 2px;
}

/* ── Chart containers ────────────────────────────────── */
.chart-box { position: relative; }
.chart-box canvas { max-width: 100%; }

/* ── Score bar under hour chart ──────────────────────── */
.chart-readout {
  min-height: 1.6em; margin-top: 8px;
  font-size: 0.78rem; color: var(--blue); font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  background: var(--blue-light); border-radius: 6px;
  padding: 4px 10px; display: none;
}
.chart-readout.visible { display: block; }

/* ── Tables ──────────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
thead th {
  text-align: left; font-weight: 600; font-size: 0.69rem;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); padding: 8px 12px;
  border-bottom: 2px solid var(--border);
  background: var(--bg);
}
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg); }
td.num, th.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
.rank-chip {
  display: inline-block; width: 24px; height: 24px; line-height: 24px;
  text-align: center; font-size: 0.7rem; font-weight: 700;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted);
}
.score-bar-cell { display: flex; align-items: center; gap: 8px; }
.score-bar-cell .bar { height: 6px; border-radius: 3px; background: var(--orange); flex-shrink: 0; min-width: 2px; }

/* ── Footer ──────────────────────────────────────────── */
footer {
  text-align: center; color: var(--muted); font-size: 0.72rem;
  border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px;
  line-height: 2;
}
footer a { color: var(--orange); font-weight: 500; }
footer a:hover { text-decoration: underline; }

/* ── Empty ───────────────────────────────────────────── */
.empty {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 40px; text-align: center;
}
code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 7px; font-size: 0.85em;
}

/* ── Animations ──────────────────────────────────────── */
@media (prefers-reduced-motion: no-preference) {
  .metric { animation: fadeUp 0.45s ease-out both; }
  .metric:nth-child(2) { animation-delay:.06s }
  .metric:nth-child(3) { animation-delay:.12s }
  .metric:nth-child(4) { animation-delay:.18s }
  .metric:nth-child(5) { animation-delay:.24s }
  ol.stories li { animation: fadeUp 0.4s ease-out both; }
  ol.stories li:nth-child(n+2) { animation-delay: calc(0.045s * var(--i)) }
  .card { animation: fadeUp 0.5s ease-out both; }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(14px); }
    to   { opacity:1; transform: translateY(0); }
  }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-box">Y</div>
    <h1>HN Daily Analytics</h1>
    <div class="header-sep"></div>
    <div class="freshness-pill" id="run">Loading…</div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
/* ── Helpers ─────────────────────────────────────────── */
const $ = (s, ctx = document) => ctx.querySelector(s);
const $$ = (s, ctx = document) => [...ctx.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const ago = iso => {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? `${Math.round(h * 60)} min ago` : h < 48 ? `${h.toFixed(1)} h ago` : `${Math.round(h / 24)} days ago`;
};

/* ── Chart defaults ──────────────────────────────────── */
Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
Chart.defaults.color = "#6b7280";

const PALETTE = ["#ff6600","#4361ee","#0ab68b","#7b2ff7","#f9a825","#ef476f","#0097b2","#ff8800","#2d6a4f","#e76f51","#9b2335","#457b9d"];
const PALETTE_LIGHT = ["#fff0e6","#eef0fd","#e6faf5","#f1ebff","#fef9e7","#fdedf1","#e0f4f8","#fff4e6","#e9f5ef","#fdf0ec","#fce8ea","#ddeef5"];

/* ── Render ──────────────────────────────────────────── */
function render(d) {
  const m = d.metrics, r = d.run;
  const stale = (Date.now() - new Date(m.snapshot_ts)) / 36e5 > 26;
  const snapDate = new Date(m.snapshot_ts).toUTCString().slice(5, 22);

  // Header pill
  $("#run").innerHTML =
    `<span class="dot" style="background:${stale ? "#ef476f" : "#0ab68b"}"></span>
     ${stale ? "Stale" : "Fresh"} &nbsp;·&nbsp; ${ago(m.snapshot_ts)} &nbsp;·&nbsp; ${snapDate} UTC`;

  // Build top-stories HTML
  const maxScore = Math.max(...d.top_stories.map(s => s.score));
  const storyItems = d.top_stories.map((s, i) => `
    <li style="--i:${i}">
      <div class="story-bar" style="background:${PALETTE[i % PALETTE.length]}"></div>
      <div class="story-num">${i + 1}</div>
      <div>
        <div class="story-title">
          ${s.url ? `<a href="${esc(s.url)}" rel="noopener" target="_blank">${esc(s.title)}</a>` : esc(s.title)}
          ${s.domain ? `<span class="story-domain">(${esc(s.domain)})</span>` : ""}
        </div>
        <div class="story-meta">
          <span class="badge score">▲ ${fmt(s.score)}</span>
          <span class="badge">💬 ${fmt(s.comment_count)} comments</span>
          <span class="badge">🕐 ${s.age_hours}h old</span>
          <span class="badge">✍️ ${esc(s.author)}</span>
        </div>
      </div>
      <div class="story-pph">⚡${s.points_per_hour}<br><span style="font-size:.65rem;color:var(--muted);font-weight:400">pts/hr</span></div>
    </li>`).join("");

  // Build authors table
  const authMax = Math.max(...d.top_authors.map(a => a.total_score || a.avg_score || 1));
  const authRows = d.top_authors.map((a, i) => `
    <tr>
      <td><span class="rank-chip">${i+1}</span></td>
      <td><b>${esc(a.author)}</b></td>
      <td class="num">${a.stories}</td>
      <td class="num">${fmt(a.total_score || 0)}</td>
      <td class="num">${(a.avg_score || 0).toFixed(0)}</td>
    </tr>`).join("");

  const domainRows = d.top_domains.map((d2, i) => `
    <tr>
      <td><span class="rank-chip">${i+1}</span></td>
      <td>
        <div class="score-bar-cell">
          <div class="bar" style="width:${(d2.stories / d.top_domains[0].stories * 80).toFixed(0)}px"></div>
          ${esc(d2.domain)}
        </div>
      </td>
      <td class="num">${d2.stories}</td>
      <td class="num">${fmt(d2.total_score)}</td>
    </tr>`).join("");

  // Inject full page
  $("#app").innerHTML = `
    <!-- Page title -->
    <div class="page-header">
      <h2>Dashboard</h2>
      <span>HN top stories · refreshed daily by GitHub Actions</span>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric">
        <div class="metric-icon" style="background:#fff0e6">📰</div>
        <b>${fmt(m.records)}</b>
        <span>Stories today</span>
      </div>
      <div class="metric">
        <div class="metric-icon" style="background:#eef0fd">🔥</div>
        <b>${fmt(m.total_points)}</b>
        <span>Total points</span>
      </div>
      <div class="metric">
        <div class="metric-icon" style="background:#e6faf5">👤</div>
        <b>${fmt(m.unique_authors)}</b>
        <span>Unique authors</span>
      </div>
      <div class="metric">
        <div class="metric-icon" style="background:#f1ebff">🗂️</div>
        <b>${m.days_of_history}</b>
        <span>Days of history</span>
      </div>
      <div class="metric">
        <div class="metric-icon" style="background:#fdedf1">💾</div>
        <b>${(m.parquet_bytes / 1024).toFixed(1)}<small style="font-size:.9rem">KB</small></b>
        <span>Parquet size</span>
      </div>
    </div>

    <!-- Top stories -->
    <div class="section-label">🔥 Front Page</div>
    <div class="card" style="padding:16px 18px">
      <div class="card-title">Top 10 Stories by Score</div>
      <div class="card-sub">Left colour bar = submission rank · ⚡ pts/hr = score velocity</div>
      <ol class="stories">${storyItems}</ol>
    </div>

    <!-- Hour chart + Score dist pie -->
    <div class="section-label">📊 Charts</div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">Average Score by Hour Posted (UTC)</div>
        <div class="card-sub">All stories in history · hover bars for details</div>
        <div class="chart-box"><canvas id="chartHour" height="200"></canvas></div>
        <div class="chart-readout" id="hourReadout"></div>
      </div>
      <div class="card">
        <div class="card-title">Score Distribution</div>
        <div class="card-sub">Stories in today's snapshot by score band</div>
        <div class="chart-box" style="max-height:260px; display:flex; justify-content:center">
          <canvas id="chartDist" height="250"></canvas>
        </div>
      </div>
    </div>

    <!-- Keywords bar + Domain pie -->
    <div class="grid2">
      <div class="card">
        <div class="card-title">Top Title Keywords</div>
        <div class="card-sub">Today's stories · common words excluded</div>
        <div class="chart-box"><canvas id="chartKw" height="260"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Top Domains</div>
        <div class="card-sub">Story count across all history</div>
        <div class="chart-box" style="max-height:270px; display:flex; justify-content:center">
          <canvas id="chartDomains" height="250"></canvas>
        </div>
      </div>
    </div>

    <!-- Daily trend timeline -->
    <div class="card">
      <div class="card-title">📈 Daily Average Score — Timeline</div>
      <div class="card-sub">${d.daily_trend.length < 2 ? "Chart fills in as the daily GitHub Actions job runs (1 day so far — come back tomorrow!)" : "Daily avg score with 7-day rolling average overlay · hover for exact values"}</div>
      <div class="chart-box"><canvas id="chartTrend" height="160"></canvas></div>
    </div>

    <!-- Tables -->
    <div class="section-label">📋 Data Tables</div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">Top Authors</div>
        <div class="card-sub">Across all history collected</div>
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th>#</th><th>Author</th>
            <th class="num">Stories</th>
            <th class="num">Total pts</th>
            <th class="num">Avg pts</th>
          </tr></thead>
          <tbody>${authRows}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-title">Top Domains</div>
        <div class="card-sub">Across all history collected</div>
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th>#</th><th>Domain</th>
            <th class="num">Stories</th>
            <th class="num">Total pts</th>
          </tr></thead>
          <tbody>${domainRows}</tbody>
        </table></div>
      </div>
    </div>

    <footer>
      Data sourced from the public <a href="https://github.com/HackerNews/API" target="_blank">Hacker News Firebase API</a>.
      Extracted with Python &middot; stored as Parquet &middot; modelled with DuckDB &middot; refreshed daily by GitHub Actions.
      <br>Built by <a href="https://github.com/VipulJunghareVJ/hn-pipeline" target="_blank">VipulJunghareVJ</a>
    </footer>`;

  /* ── Chart.js charts ───────────────────────────────── */

  // 1. Bar: Score by hour
  const hourCtx = $("#chartHour").getContext("2d");
  const hourChart = new Chart(hourCtx, {
    type: "bar",
    data: {
      labels: d.score_by_hour.map(h => `${String(h.hour).padStart(2,"0")}:00`),
      datasets: [{
        label: "Avg Score",
        data: d.score_by_hour.map(h => h.avg_score),
        backgroundColor: d.score_by_hour.map((h, i) => {
          const alpha = 0.4 + (h.avg_score / Math.max(...d.score_by_hour.map(x => x.avg_score))) * 0.6;
          return `rgba(255,102,0,${alpha.toFixed(2)})`;
        }),
        borderColor: "#ff6600",
        borderWidth: 1.5,
        borderRadius: 5,
        borderSkipped: false,
      }, {
        label: "Median Score",
        data: d.score_by_hour.map(h => h.median_score),
        type: "line",
        borderColor: "#4361ee",
        backgroundColor: "rgba(67,97,238,0.08)",
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: "#4361ee",
        tension: 0.4,
        fill: false,
      }]
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", labels: { boxWidth: 12, padding: 16, font: { size: 12 } } },
        tooltip: {
          callbacks: {
            afterBody: (items) => {
              const idx = items[0].dataIndex;
              const h = d.score_by_hour[idx];
              return `Stories: ${h.stories}`;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, font: { size: 11 } } },
        y: { grid: { color: "#f0f0f0" }, ticks: { font: { size: 11 } } }
      },
      onHover: (evt, elements) => {
        const readout = $("#hourReadout");
        if (elements.length) {
          const idx = elements[0].index;
          const h = d.score_by_hour[idx];
          readout.textContent = `${String(h.hour).padStart(2,"0")}:00–${String((h.hour+1)%24).padStart(2,"0")}:00 UTC  ·  ${h.stories} stories  ·  avg ${h.avg_score} pts  ·  median ${h.median_score} pts`;
          readout.classList.add("visible");
        } else {
          readout.classList.remove("visible");
        }
      }
    }
  });

  // 2. Doughnut: Score distribution
  const distCtx = $("#chartDist").getContext("2d");
  new Chart(distCtx, {
    type: "doughnut",
    data: {
      labels: d.score_distribution.map(b => b.bucket),
      datasets: [{
        data: d.score_distribution.map(b => b.stories),
        backgroundColor: ["#ff6600","#4361ee","#0ab68b","#7b2ff7","#ef476f"],
        borderColor: "#ffffff",
        borderWidth: 3,
        hoverOffset: 8,
      }]
    },
    options: {
      responsive: true,
      cutout: "60%",
      plugins: {
        legend: {
          position: "right",
          labels: { boxWidth: 12, padding: 14, font: { size: 12 }, generateLabels: (chart) => {
            const data = chart.data;
            return data.labels.map((label, i) => ({
              text: `${label} (${data.datasets[0].data[i]})`,
              fillStyle: data.datasets[0].backgroundColor[i],
              strokeStyle: "#fff",
              lineWidth: 2,
              hidden: false,
              index: i,
            }));
          }}
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.raw} stories (${((ctx.raw / d.metrics.records)*100).toFixed(1)}%)`
          }
        }
      }
    }
  });

  // 3. Horizontal bar: Keywords
  const kwCtx = $("#chartKw").getContext("2d");
  const topKw = d.keywords.slice(0, 15);
  new Chart(kwCtx, {
    type: "bar",
    data: {
      labels: topKw.map(k => k.word),
      datasets: [{
        label: "Stories",
        data: topKw.map(k => k.stories),
        backgroundColor: topKw.map((_, i) => PALETTE[i % PALETTE.length] + "cc"),
        borderColor: topKw.map((_, i) => PALETTE[i % PALETTE.length]),
        borderWidth: 1.5,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const kw = topKw[ctx.dataIndex];
              return [`Stories: ${ctx.raw}`, `Total score: ${fmt(kw.total_score)}`];
            }
          }
        }
      },
      scales: {
        x: { grid: { color: "#f0f0f0" }, ticks: { stepSize: 1, font: { size: 11 } } },
        y: { grid: { display: false }, ticks: { font: { size: 12 } } }
      }
    }
  });

  // 4. Pie: Top domains
  const domCtx = $("#chartDomains").getContext("2d");
  const topDoms = d.top_domains.slice(0, 8);
  const otherStories = d.top_domains.slice(8).reduce((s, x) => s + x.stories, 0);
  const domLabels = topDoms.map(x => x.domain);
  const domData   = topDoms.map(x => x.stories);
  if (otherStories > 0) { domLabels.push("others"); domData.push(otherStories); }
  new Chart(domCtx, {
    type: "pie",
    data: {
      labels: domLabels,
      datasets: [{
        data: domData,
        backgroundColor: PALETTE.slice(0, domLabels.length),
        borderColor: "#ffffff",
        borderWidth: 3,
        hoverOffset: 10,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "right",
          labels: { boxWidth: 12, padding: 12, font: { size: 11 } }
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const total = domData.reduce((a,b) => a+b, 0);
              return ` ${ctx.label}: ${ctx.raw} stories (${((ctx.raw/total)*100).toFixed(1)}%)`;
            }
          }
        }
      }
    }
  });

  // 5. Line: Daily trend
  const trendCtx = $("#chartTrend").getContext("2d");
  new Chart(trendCtx, {
    type: "line",
    data: {
      labels: d.daily_trend.map(r => r.day),
      datasets: [
        {
          label: "Daily avg score",
          data: d.daily_trend.map(r => r.avg_score),
          borderColor: "#4361ee",
          backgroundColor: "rgba(67,97,238,0.07)",
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: "#4361ee",
          pointBorderColor: "#fff",
          pointBorderWidth: 2,
          tension: 0.35,
          fill: true,
        },
        {
          label: "7-day rolling avg",
          data: d.daily_trend.map(r => r.rolling_7d_avg),
          borderColor: "#ff6600",
          backgroundColor: "rgba(255,102,0,0.06)",
          borderWidth: 2.5,
          pointRadius: 3,
          pointBackgroundColor: "#ff6600",
          pointBorderColor: "#fff",
          pointBorderWidth: 2,
          tension: 0.4,
          fill: false,
          borderDash: d.daily_trend.length < 7 ? [6, 3] : [],
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", labels: { boxWidth: 14, padding: 16, font: { size: 12 } } },
        tooltip: {
          callbacks: {
            title: items => {
              const t = d.daily_trend[items[0].dataIndex];
              return `${t.day}  (${t.stories} stories)`;
            }
          }
        }
      },
      scales: {
        x: {
          type: "category",
          grid: { display: false },
          ticks: { font: { size: 11 }, maxRotation: 30 }
        },
        y: {
          grid: { color: "#f0f0f0" },
          ticks: { font: { size: 11 } },
          title: { display: true, text: "Avg Score", font: { size: 11 }, color: "#6b7280" }
        }
      }
    }
  });
}

/* ── Fetch & boot ────────────────────────────────────── */
fetch("data/dashboard.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(render)
  .catch(e => {
    $("#run").textContent = "No data";
    $("#app").innerHTML = `<div class="empty">
      <h2 style="margin-bottom:10px">No snapshot found</h2>
      <p style="color:var(--muted)">web/data/dashboard.json is missing (${esc(e.message)}).<br>
      Run <code>python -m pipeline.run_pipeline</code>, commit the output, and push.</p></div>`;
  });
</script>
</body>
</html>
