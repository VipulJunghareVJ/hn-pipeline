name: Daily HN pipeline

on:
  schedule:
    # Every 4 hours at :15 (06:15, 10:15, 14:15 … UTC). Several runs a day let
    # the pipeline measure score velocity ("rising stories"); the daily
    # partition keeps the day's last run, so daily marts are unaffected.
    - cron: "15 */4 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # lets the job commit the new data back

concurrency: daily-pipeline # never run two snapshots at once

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pipeline + test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (offline, fixture data)
        run: pytest

      # Exits non-zero if a data-quality check fails; nothing is committed then.
      - name: Extract, quality-check, transform, load, export
        run: python -m pipeline.run_pipeline --limit 50

      - name: Commit new snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +'%F %H:%M') UTC"
          git pull --rebase   # in case someone pushed meanwhile
          git push
