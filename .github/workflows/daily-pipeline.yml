name: Daily HN pipeline

on:
  schedule:
    - cron: "15 6 * * *"   # every day 06:15 UTC (11:45 IST)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # lets the job commit the new data back

concurrency: daily-pipeline # never run two snapshots at once

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Extract, transform, load, export
        run: python -m pipeline.run_pipeline --limit 50

      - name: Commit new snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%F)"
          git push
